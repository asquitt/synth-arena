name: Evaluation Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to evaluate"
        required: false
        default: "web-scraping"
      scenarios:
        description: "Number of scenarios"
        required: false
        default: "20"

permissions:
  contents: read
  pull-requests: write

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: npx vitest run packages/core/src/evaluate.test.ts

      - name: Download baseline
        uses: actions/cache@v4
        with:
          path: .syntharena/baselines
          key: eval-baseline-${{ github.base_ref }}-${{ hashFiles('packages/core/src/**', 'packages/shared/src/**') }}
          restore-keys: |
            eval-baseline-${{ github.base_ref }}-
            eval-baseline-main-

      - name: Run evaluation
        run: |
          DOMAIN="${{ github.event.inputs.domain || 'web-scraping' }}"
          SCENARIOS="${{ github.event.inputs.scenarios || '20' }}"

          node apps/cli/dist/index.js run \
            --domain "$DOMAIN" \
            --scenarios "$SCENARIOS" \
            --trials 3

      - name: Run regression check
        id: regression
        run: |
          BASELINE=".syntharena/baselines/latest.json"

          if [ -f "$BASELINE" ]; then
            echo "Baseline found, running regression comparison..."
            node apps/cli/dist/index.js replay \
              --domain web-scraping \
              --scenarios 20 \
              --trials 3 \
              --baseline-path "$BASELINE" | tee regression-report.txt

            EXIT_CODE=${PIPESTATUS[0]}
            echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

            if [ $EXIT_CODE -ne 0 ]; then
              echo "has_regression=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_regression=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No baseline found, saving initial baseline..."
            node apps/cli/dist/index.js replay \
              --domain web-scraping \
              --scenarios 20 \
              --trials 3 \
              --save-baseline "$BASELINE"
            echo "has_regression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save updated baseline
        if: github.event_name == 'push' || steps.regression.outputs.has_regression == 'false'
        run: |
          mkdir -p .syntharena/baselines
          node apps/cli/dist/index.js replay \
            --domain web-scraping \
            --scenarios 20 \
            --trials 3 \
            --save-baseline .syntharena/baselines/latest.json

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const hasRegression = '${{ steps.regression.outputs.has_regression }}' === 'true';
            let reportContent = '';

            try {
              reportContent = fs.readFileSync('regression-report.txt', 'utf8');
            } catch {
              reportContent = 'No regression report available (first run).';
            }

            const icon = hasRegression ? ':x:' : ':white_check_mark:';
            const status = hasRegression ? 'REGRESSION DETECTED' : 'Evaluation Passed';

            const body = `## ${icon} SynthArena Eval Gate: ${status}

            \`\`\`
            ${reportContent}
            \`\`\`

            <sub>Generated by [SynthArena](https://github.com/asquitt/synth-arena) CI</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body.includes('SynthArena Eval Gate')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on regression
        if: steps.regression.outputs.has_regression == 'true'
        run: |
          echo "Evaluation regression detected! See PR comment for details."
          exit 1
