name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syntharena
          POSTGRES_PASSWORD: syntharena
          POSTGRES_DB: syntharena
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Build all packages
        run: pnpm build

      - name: Run database migrations
        run: pnpm --filter=@syntharena/api run migrate
        env:
          DATABASE_URL: postgresql://syntharena:syntharena@localhost:5432/syntharena

      - name: Run tests
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://syntharena:syntharena@localhost:5432/syntharena
          REDIS_URL: redis://localhost:6379
